name: POC-1 Hardening

on:
  push:
    branches: [main]
    paths:
      - 'examples/bounded-arithmetic/**'
      - 'examples/optimization-preservation/**'
      - 'prototypes/poc1/**'
      - 'prototypes/poc1b/**'
      - 'tests/poc1b/**'
      - 'rfcs/0007-bounded-integer-semantics.md'
      - 'rfcs/0008-c-semantic-and-optimization-preservation.md'
      - '.github/workflows/poc1-hardening.yml'
  workflow_dispatch:

jobs:
  semantic-preservation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Z3
        run: python -m pip install 'z3-solver==4.13.0.0'

      - name: Install CBMC 6.10.0
        run: |
          curl -L -o /tmp/cbmc.deb https://github.com/diffblue/cbmc/releases/download/cbmc-6.10.0/ubuntu-24.04-cbmc-6.10.0-Linux.deb
          echo 'd716c219c5318a54f5298f9d5f66766d599e2e37bede33224437a8ad487fc504  /tmp/cbmc.deb' | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y /tmp/cbmc.deb
          cbmc --version

      - name: POC-1B unit tests
        run: python -m unittest discover -s tests/poc1b -p 'test_*.py' -v

      - name: Run hardened POC-1A
        run: |
          python prototypes/poc1/spec2exec_poc1_v2.py all \
            examples/bounded-arithmetic/safe_add.specir.json \
            --specification examples/bounded-arithmetic/specification.json \
            --build-dir build/poc1-v2

      - name: Run POC-1B
        run: |
          python prototypes/poc1b/spec2exec_poc1b.py \
            examples/optimization-preservation/safe_add_sub.specir.json \
            --specification examples/optimization-preservation/specification.json \
            --build-dir build/poc1b

      - name: Show evidence
        run: |
          cat build/poc1-v2/evidence.json
          cat build/poc1b/evidence.json
